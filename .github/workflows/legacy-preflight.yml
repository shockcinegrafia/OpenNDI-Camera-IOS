name: Legacy iOS 9 source preflight
on:
  workflow_dispatch:
  push:
    paths:
      - 'ios/**'
      - 'Makefile'
      - 'control'
      - '.github/workflows/legacy-preflight.yml'
jobs:
  source-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate source and metadata
        shell: bash
        run: |
          set -euo pipefail
          test -f Makefile
          test -f control
          test -f scripts/package-ipa.sh
          bash -n scripts/package-ipa.sh
          test -f ios/OpenNDILegacy/main.m
          test -f ios/OpenNDILegacy/Info.plist
          grep -Eq '^ARCHS := armv7$' Makefile
          grep -Eq '^TARGET := iphone:clang:9.3:9.0$' Makefile
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          plist = plistlib.loads(Path('ios/OpenNDILegacy/Info.plist').read_bytes())
          assert plist['MinimumOSVersion'] == '9.0'
          assert plist['CFBundleExecutable'] == 'OpenNDILegacy'
          print('Source metadata OK. This is NOT an ARMv7 compilation.')
          PY
      - name: Report build requirements
        run: |
          echo 'An ARMv7-compatible Theos compiler and licensed iOS 9 SDK are still required.'
          echo 'No IPA or DEB is produced by this source-only workflow.'
