name: ARMv7 build readiness and packaging
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-build.yml'
      - 'Makefile'
      - 'ios/**'
      - 'scripts/package-ipa.sh'

permissions:
  contents: read

jobs:
  armv7:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Inspect GitHub-hosted toolchain
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          {
            echo "OpenNDI Legacy ARMv7 build readiness"
            echo "Host: $(uname -a)"
            echo "Xcode: $(xcodebuild -version | tr '\n' ' ')"
            echo "SDKs:"
            xcodebuild -showsdks
            echo "Clang: $(xcrun --find clang)"
            echo "ARMv7 iOS9 SDK directories:"
            find "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs" -maxdepth 1 -name '*9*.sdk' -print 2>/dev/null || true
          } | tee packages/toolchain-report.txt
          if find "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs" -maxdepth 1 -name '*9*.sdk' 2>/dev/null | grep -q .; then
            echo "sdk_available=true" >> "$GITHUB_OUTPUT"
          else
            echo "sdk_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::iOS 9 SDK is unavailable on this runner. No build will be attempted."
          fi
      - name: Install Theos and build (only with compatible SDK)
        if: steps.inspect.outputs.sdk_available == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos"
          mkdir -p "$THEOS/sdks"
          SDK="$(find "$(xcode-select -p)/Platforms/iPhoneOS.platform/Developer/SDKs" -maxdepth 1 -name '*9*.sdk' -print -quit)"
          ln -s "$SDK" "$THEOS/sdks/iPhoneOS9.3.sdk"
          make clean package
          APP="$(find .theos -type d -name OpenNDILegacy.app -print -quit)"
          test -n "$APP"
          bash scripts/package-ipa.sh "$APP" packages/OpenNDILegacy-unsigned.ipa
      - name: Enforce actual ARMv7 build result
        if: steps.inspect.outputs.sdk_available != 'true'
        shell: bash
        run: |
          echo "::error::No iOS 9 SDK was found. ARMv7 build was not performed; failing instead of reporting a misleading green result."
          exit 1
      - name: Upload readiness report and available artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNDI-ARMv7-diagnostics
          path: packages/
          if-no-files-found: warn
