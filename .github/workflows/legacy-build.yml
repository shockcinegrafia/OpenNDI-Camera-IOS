name: ARMv7 iOS 9 Theos SDK experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-build.yml'
      - 'Makefile'
      - 'ios/**'
      - 'scripts/package-ipa.sh'

permissions:
  contents: read

jobs:
  armv7:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and SDK repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          SDK="$(find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -type d -name 'iPhoneOS9*.sdk' -print -quit)"
          if [ -z "$SDK" ]; then
            echo "::error::No iPhoneOS9.x SDK in the Theos SDK repository."
            exit 1
          fi
          ln -s "$SDK" "$RUNNER_TEMP/theos/sdks/$(basename "$SDK")"
          echo "SDK_FOUND=$(basename "$SDK")" >> "$GITHUB_ENV"
          echo "Found SDK: $SDK"
          test -d "$SDK/System/Library/Frameworks/Foundation.framework" || { echo "::error::Foundation.framework missing from SDK"; exit 1; }
          test -d "$SDK/System/Library/Frameworks/AVFoundation.framework" || { echo "::error::AVFoundation.framework missing from SDK"; exit 1; }

      - name: Diagnose SDK target platforms and liblaunch dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          SDK="$THEOS/sdks/$SDK_FOUND"
          {
            echo "SDK path: $SDK"
            echo "SDK realpath: $(cd "$SDK" && pwd -P)"
            echo "SDK root libSystem:"
            ls -l "$SDK/usr/lib/libSystem.tbd" || true
            echo "SDK liblaunch candidates:"
            find "$SDK" -iname '*liblaunch*' -print || true
            echo "SDK stub platform metadata:"
            for stub in "$SDK/usr/lib/libSystem.tbd" "$SDK/usr/lib/libobjc.tbd" "$SDK/System/Library/Frameworks/Foundation.framework/Foundation.tbd"; do
              echo "----- $stub -----"
              if [ -f "$stub" ]; then
                grep -nE '^(archs|targets|platform|install-name|reexported-libraries):|liblaunch' "$stub" | head -n 55 || true
              else
                echo "Missing"
              fi
            done
            echo "Clang and linker:"
            xcrun --find clang
            xcrun --find ld
          } | tee packages/sdk-linker-diagnostic.txt

      - name: Build ARMv7 application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          echo "SDK: $SDK_FOUND" | tee packages/build-report.txt
          echo "Host: $(uname -a)" | tee -a packages/build-report.txt
          echo "Clang: $(xcrun --find clang)" | tee -a packages/build-report.txt
          set +e
          make clean package > packages/build.log 2>&1
          status=$?
          set -e
          cat packages/build.log
          if [ "$status" -ne 0 ]; then
            echo "::error::Theos make package failed with exit code $status. See build.log artifact."
            {
              echo "### ARMv7 compilation failed"
              echo ""
              echo "Exit code: $status"
              echo ""
              echo '~~~'
              tail -n 45 packages/build.log
              echo '~~~'
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

      - name: Validate architecture and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name 'OpenNDILegacy.app' -print -quit)"
          test -n "$APP"
          bash scripts/package-ipa.sh "$APP" packages/OpenNDILegacy-unsigned.ipa
          lipo -info "$APP/OpenNDILegacy" | tee -a packages/build-report.txt

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNDI-ARMv7-Theos-experiment
          path: |
            packages/
          if-no-files-found: warn
