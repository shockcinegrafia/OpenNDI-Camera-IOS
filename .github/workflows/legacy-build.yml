name: ARMv7 iOS 9 private SDK build
on:
  workflow_dispatch:
    inputs:
      allow_paid_macos:
        description: 'I explicitly authorize the macOS build'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

env:
  SDK_GDRIVE_FILE_ID: ${{ vars.SDK_GDRIVE_FILE_ID }}
  SDK_SHA256: ${{ vars.SDK_SHA256 }}

jobs:
  sdk-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Require private SDK credentials and settings
        env:
          SDK_CREDENTIALS: ${{ secrets.SDK_GDRIVE_SA_JSON }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SDK_CREDENTIALS" || { echo "::error::Missing SDK_GDRIVE_SA_JSON secret"; exit 1; }
          test -n "$SDK_GDRIVE_FILE_ID" || { echo "::error::Missing SDK_GDRIVE_FILE_ID variable"; exit 1; }
          test -n "$SDK_SHA256" || { echo "::error::Missing SDK_SHA256 variable"; exit 1; }
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SDK_GDRIVE_SA_JSON }}
      - name: Download and inspect original private SDK (Linux only)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check google-auth requests
          python3 scripts/download-private-sdk.py "$RUNNER_TEMP/sdk-private.zip"
          python3 - "$RUNNER_TEMP/sdk-private.zip" <<'PY'
          import pathlib, sys, zipfile
          path = pathlib.Path(sys.argv[1])
          with zipfile.ZipFile(path) as z:
              bad = z.testzip()
              if bad:
                  sys.exit("Corrupt SDK ZIP member")
              names = set(z.namelist())
              required = [
                  "iPhoneOS.sdk/SDKSettings.plist",
                  "iPhoneOS.sdk/usr/lib/libSystem.B.tbd",
                  "iPhoneOS.sdk/System/Library/Frameworks/Foundation.framework/Foundation.tbd",
                  "iPhoneOS.sdk/System/Library/Frameworks/AVFoundation.framework/AVFoundation.tbd",
              ]
              for name in required:
                  if name not in names:
                      sys.exit("Missing SDK entry: " + name)
              for name in required[1:]:
                  data = z.read(name).decode("utf-8", errors="replace")
                  if "armv7" not in data or "platform:        ios" not in data:
                      sys.exit("Invalid ARMv7 iOS platform stub: " + name)
                  if "liblaunch.dylib" in data:
                      sys.exit("liblaunch reference found: " + name)
              print("Original iPhoneOS SDK validated on Linux; no paid macOS job required")
          PY
          # Also validate actual extraction, including 47 Unix symlinks.
          python3 scripts/extract-ios-sdk.py "$RUNNER_TEMP/sdk-private.zip" "$RUNNER_TEMP/sdk-extraction-test"
      - name: Confirm private SDK preflight
        run: echo "Private iOS 9 SDK passed Linux ZIP and stub checks" >> "$GITHUB_STEP_SUMMARY"

  armv7:
    needs: sdk-preflight
    if: ${{ inputs.allow_paid_macos == true || (github.event_name == 'push' && github.ref == 'refs/heads/legacy-v0.3.0' && github.event.head_commit.message == 'Build authorized Legacy v0.3.0 ARMv7') }}
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.SDK_GDRIVE_SA_JSON }}
      - name: Install Theos and original private SDK
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew Python on macOS is externally managed (PEP 668).
          # Install dependencies in an isolated environment; never modify system Python.
          python3 -m venv "$RUNNER_TEMP/openndi-sdk-venv"
          "$RUNNER_TEMP/openndi-sdk-venv/bin/python" -m pip install --disable-pip-version-check google-auth requests
          "$RUNNER_TEMP/openndi-sdk-venv/bin/python" scripts/download-private-sdk.py "$RUNNER_TEMP/sdk-private.zip"
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          export THEOS="$RUNNER_TEMP/theos"
          mkdir -p "$THEOS/sdks" "$RUNNER_TEMP/sdk-unpacked"
          # Do not use ZipFile.extractall(): it turns SDK symlinks into invalid C headers.
          python3 scripts/extract-ios-sdk.py "$RUNNER_TEMP/sdk-private.zip" "$RUNNER_TEMP/sdk-unpacked"
          test -f "$RUNNER_TEMP/sdk-unpacked/iPhoneOS.sdk/usr/lib/libSystem.B.tbd"
          ln -s "$RUNNER_TEMP/sdk-unpacked/iPhoneOS.sdk" "$THEOS/sdks/iPhoneOS9.3.sdk"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          echo "$THEOS/bin" >> "$GITHUB_PATH"
          echo "Original private iPhoneOS9.3 SDK installed"
      - name: Install and verify Theos signing tool
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          command -v ldid
          ldid -h || true

      - name: Check versioned web resources
        run: test -s ios/OpenNDILegacy/index_full.html && test -s ios/OpenNDILegacy/index_lite.html && test -s ios/OpenNDILegacy/legacy.js

      - name: Build ARMv7 application
        shell: bash
        run: |
          set -euo pipefail
          command -v ldid
          mkdir -p packages
          make clean package > packages/build.log 2>&1 || {
            tail -n 100 packages/build.log
            exit 1
          }
          # Theos may remove its staging .app after building the Debian package.
          # Extract the signed ARMv7 binary from the produced .deb instead.
          DEB="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$DEB"
          STAGE="$RUNNER_TEMP/openndi-ipa-stage"
          mkdir -p "$STAGE"
          (cd "$STAGE" && ar -x "$GITHUB_WORKSPACE/$DEB" && tar -xf data.tar.lzma)
          APP="$STAGE/Applications/OpenNDILegacy.app"
          test -f "$APP/OpenNDILegacy"
          # Legacy Theos did not include Info.plist in the previous .deb.
          # The IPA must include it even when the package stage omits it.
          if [ ! -f "$APP/Info.plist" ]; then
            cp ios/OpenNDILegacy/Info.plist "$APP/Info.plist"
          fi
          plutil -lint "$APP/Info.plist"
          test "$(lipo -archs "$APP/OpenNDILegacy")" = armv7
          test "$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$APP/Info.plist")" = 9.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = 0.3.0
          test -s "$APP/index_full.html"
          test -s "$APP/index_lite.html"
          test -s "$APP/legacy.js"
          lipo -info "$APP/OpenNDILegacy"
          bash scripts/package-ipa.sh "$APP" packages/OpenNDILegacy-unsigned.ipa
      - name: Upload IPA and logs (never upload SDK)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNDI-ARMv7-original-SDK
          path: packages/
          if-no-files-found: warn
