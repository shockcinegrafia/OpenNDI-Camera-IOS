name: Build iOS 9 ARMv7 (GitHub-hosted)
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"

      - name: Check ARMv7 compiler and SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "Checking toolchain on GitHub-hosted macOS..."
          xcrun --find clang
          clang --version
          if [ ! -d "$THEOS/sdks" ]; then mkdir -p "$THEOS/sdks"; fi
          if ! find "$THEOS/sdks" -maxdepth 1 -type d -name 'iPhoneOS9*.sdk' | grep -q .; then
            echo "::error::iPhoneOS9.x SDK not present. The workflow cannot legally obtain or redistribute Apple's legacy SDK automatically. Supply an authorized SDK via an approved mechanism."
            exit 1
          fi
          if ! xcrun --sdk iphoneos clang -arch armv7 -miphoneos-version-min=9.0 -x objective-c -fsyntax-only - <<< '#import <Foundation/Foundation.h>' ; then
            echo "::error::Installed Apple toolchain does not support ARMv7 with available SDK. A compatible legacy toolchain is required."
            exit 1
          fi

      - name: Build package
        run: make clean package

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name OpenNDILegacy.app -print -quit)"
          test -n "$APP"
          bash scripts/package-ipa.sh "$APP" packages/OpenNDILegacy-unsigned.ipa

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenNDI-Camera-Legacy-ARMv7
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: error
