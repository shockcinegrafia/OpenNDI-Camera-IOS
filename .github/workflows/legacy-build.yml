name: Build iOS 9 ARMv7 (self-hosted)
on:
  workflow_dispatch:
jobs:
  build:
    # Requires a self-hosted runner prepared with an ARMv7-capable
    # Theos compiler, iPhoneOS9.x SDK, lipo, and package tooling.
    runs-on: [self-hosted, macOS, ios9-armv7]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate toolchain
        shell: bash
        run: |
          set -euo pipefail
          : "${THEOS:?THEOS must be set on the runner}"
          test -f "$THEOS/makefiles/common.mk"
          test -d "$THEOS/sdks"
          find "$THEOS/sdks" -maxdepth 1 -name 'iPhoneOS9*.sdk' | grep -q .
          command -v make
          command -v lipo
          command -v zip
      - name: Build rootful jailbreak package
        run: make clean package
      - name: Locate app and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name 'OpenNDILegacy.app' -print -quit)"
          test -n "$APP"
          bash scripts/package-ipa.sh "$APP" packages/OpenNDILegacy-unsigned.ipa
      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: OpenNDI-Camera-Legacy-ARMv7
          path: |
            packages/*.deb
            packages/*.ipa
          if-no-files-found: error
