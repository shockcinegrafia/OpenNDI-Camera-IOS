name: ARMv7 iOS 9 Theos SDK experiment
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/legacy-build.yml'
      - 'Makefile'
      - 'ios/**'
      - 'scripts/package-ipa.sh'

permissions:
  contents: read

jobs:
  armv7:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Install Theos and SDK repository
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --recursive https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/theos/bin" >> "$GITHUB_PATH"
          mkdir -p "$RUNNER_TEMP/theos/sdks"
          SDK="$(find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -type d -name 'iPhoneOS9*.sdk' -print -quit)"
          if [ -z "$SDK" ]; then
            echo "::error::No iPhoneOS9.x SDK in the Theos SDK repository."
            exit 1
          fi
          ln -s "$SDK" "$RUNNER_TEMP/theos/sdks/$(basename "$SDK")"
          echo "SDK_FOUND=$(basename "$SDK")" >> "$GITHUB_ENV"
          echo "Found SDK: $SDK"
          test -d "$SDK/System/Library/Frameworks/Foundation.framework"
          test -d "$SDK/System/Library/Frameworks/AVFoundation.framework"

      - name: Build ARMv7 application
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p packages
          echo "SDK: $SDK_FOUND" | tee packages/build-report.txt
          echo "Host: $(uname -a)" | tee -a packages/build-report.txt
          echo "Clang: $(xcrun --find clang)" | tee -a packages/build-report.txt
          make clean package 2>&1 | tee packages/build.log

      - name: Validate architecture and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP="$(find .theos -type d -name 'OpenNDILegacy.app' -print -quit)"
          test -n "$APP"
          bash scripts/package-ipa.sh "$APP" packages/OpenNDILegacy-unsigned.ipa
          lipo -info "$APP/OpenNDILegacy" | tee -a packages/build-report.txt

      - name: Upload build logs and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: OpenNDI-ARMv7-Theos-experiment
          path: |
            packages/
          if-no-files-found: warn
